[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cn-fund-advisor"
version = "0.1.0"
description = "Auditable research assistant for mainland Chinese public funds; no automated trading"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "numpy>=2.0,<3",
  "pandas>=2.2,<3", "streamlit>=1.42,<2", "openai>=1.68,<3",
  "tenacity>=9,<10", "tzdata>=2025.1", "pyyaml>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
fund-advisor = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
